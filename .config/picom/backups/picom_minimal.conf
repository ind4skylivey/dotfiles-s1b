# ============================================
# Picom Configuration - MINIMAL / FOCUS MODE
# ============================================
# This mode disables ALL visual effects for maximum focus.
# It still keeps all performance/stability optimizations
# (the ones that don't distract but prevent glitches, flicker and tearing).
#
# Switch to full with:  ~/.config/picom/switch-mode.sh full
# View status:          ~/.config/picom/switch-mode.sh status
# ============================================

# --- Backend ---
# Note: glx-no-stencil and glx-no-rebind-pixmap are deprecated in v13,
# the driver now decides automatically.
backend = "glx";
glx-swap-method = 2;               # Wait-for-vblank (stable with vsync)
vsync = true;
xrender-sync-fence = true;         # Extra sync with the driver

# --- Damage tracking (useful in multi-monitor setups) ---
# Note: resize-damage is deprecated in v13, use-damage covers it.
use-damage = true;
crop-shadow-to-monitor = true;     # Crop shadows to the monitor (multi-monitor)

# --- Performance ---
unredir-if-possible = true;        # Fullscreen = unredirected (gaming/video)
unredir-if-possible-delay = 5000;  # Wait 5s, prevents flicker on alt-tab

# --- Focus tracking (needed in some WMs) ---
mark-wmwin-focused = true;
mark-ovredir-focused = true;

# --- D-Bus (script integration) ---
dbus = true;

# ============================================
# VISUAL EFFECTS: OFF (focus mode)
# ============================================

# Shadows: OFF
shadow = false;

# Fading: OFF
fading = false;

# Blur: OFF
blur-background = false;

# Rounded corners: OFF
corner-radius = 0;
detect-rounded-corners = false;

# Animations: OFF
animations = false;

# --- Transparency (everything opaque, no visual fatigue) ---
active-opacity = 1.0;
inactive-opacity = 1.0;

opacity-rule = [
  "100:class_g = 'warp'",
  "100:class_g = 'kitty'",
  "100:class_g = 'es-de'",
  "100:class_g = 'OpenRGB'",
  "100:class_g = 'retroarch'",
  "100:class_g = 'mpv'",
  "100:class_g = 'slstatus'",
  "100:class_g = 'Dunst'",
  "100:fullscreen",
  "100:window_type = 'dock'",
  "100:window_type = 'desktop'",
  "100:_NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN'"
];

# --- Detection (same in both modes) ---
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# --- Window types (consistent between modes) ---
wintypes:
{
  tooltip        = { fade = false; shadow = false; opacity = 1.0; focus = true; };
  dock           = { shadow = false; clip-shadow-above = true; };
  dnd            = { shadow = false; };
  popup_menu     = { opacity = 1.0; shadow = false; };
  dropdown_menu  = { opacity = 1.0; shadow = false; };
  utility        = { opacity = 1.0; };
  menu           = { opacity = 1.0; };
};

# --- Logging ---
log-level = "warn";
log-file = "/tmp/picom.log";
