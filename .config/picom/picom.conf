# Backend
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
vsync = false;

# Performance
unredir-if-possible = true;  # Unredirect fullscreen windows (better gaming performance)
use-damage = true;

# Shadows (Beautiful depth effect!)
shadow = true;
shadow-radius = 7;
shadow-opacity = 0.75;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-exclude = [
  "class_g = 'Notification'",
  "class_g = 'dunst'",
  "name = 'Notification'",
  "_GTK_FRAME_EXTENTS",
  "window_type = 'notification'",
  "class_g = 'slstatus'",
  "class_g = 'Dunst'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Fading (Smooth transitions!)
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# Transparency
active-opacity = 1.0;
inactive-opacity = 0.95;
inactive-dim = 0.2;
opacity-rule = [
  "90:class_g = 'kitty'",
  "95:class_g = 'Zen-browser'",
  "100:class_g = 'mpv'",
  "100:fullscreen"
];

# Rounded Corners (Modern look!)
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
];

# Blur (Gorgeous effect!)
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-exclude = [
  "_GTK_FRAME_EXTENTS",
  "window_type = 'notification'",
  "window_type = 'desktop'",
  "class_g = 'slstatus'",
  "class_g = 'mpv'"
];

# Window Animations (v12+ feature)
animations = true;
animation-stiffness = 300;
animation-dampening = 25;
animation-window-mass = 0.4;
animation-clamping = false;

animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-menu-window = "slide-down";
animation-for-transient-window = "slide-down";

# General Settings
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
log-level = "warn";

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; shadow = false; };
  dropdown_menu = { opacity = 1.0; shadow = false; };
};