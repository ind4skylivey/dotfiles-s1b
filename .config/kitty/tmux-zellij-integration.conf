#
# Remember: You control everything! Pick what you need, ignore the rest.
#

# ============================================================================
# TROUBLESHOOTING
# ============================================================================
#
# Colors not showing in Tmux?
#   → Check: echo $TERM (should be "tmux-256color" or "xterm-kitty")
#   → Add: set -g default-terminal "tmux-256color"
#
# Colors not showing in Zellij?
#   → Check: zellij list-sessions
#   → Add: allow_passthrough true
#   → Restart Zellij
#
# Keys not working properly?
#   → Add: set -s allow-passthrough on (Tmux)
#   → Add: allow_passthrough true (Zellij)
#
# Still having issues?
#   → Keep your personal configuration and skip Tmux/Zellij changes
#   → Kitty + Zen Browser work perfectly on their own!
#

