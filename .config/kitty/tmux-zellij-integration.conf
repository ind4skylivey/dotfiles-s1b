# Kitty Integration with Tmux and Zellij - OPTIONAL RECOMMENDATIONS
# ===================================================================
# 
# ⚠️  IMPORTANT: This file contains OPTIONAL recommendations only.
# These changes will NOT overwrite or break your existing Tmux/Zellij setup.
# You have full control - pick and choose what to apply, or ignore everything.
#
# You can safely keep your personal optimizations intact!
#

# ============================================================================
# TMUX INTEGRATION - OPTIONAL RECOMMENDATIONS
# ============================================================================
#
# If you want Kitty + Tmux to work perfectly together with true color support,
# add ONLY these lines to your ~/.tmux.conf (they won't affect anything else):
#
#   set -g default-terminal "tmux-256color"
#   set -ga terminal-overrides ",tmux-256color:RGB"
#   set -ga terminal-overrides ",xterm-kitty:RGB"
#   set -s allow-passthrough on
#
# What this does:
#   ✓ Enables 24-bit true color in Tmux
#   ✓ Allows Kitty to pass through special sequences
#   ✓ Makes Tmux work seamlessly with Kitty's extended features
#   ✓ Does NOT change any keybindings or your personal config
#
# If you already have color support configured, you can skip this!
#

# ============================================================================
# ZELLIJ INTEGRATION - OPTIONAL RECOMMENDATIONS
# ============================================================================
#
# If you want Zellij to use the same cyberpunk synthwave color scheme
# as Kitty and Zen Browser, add this to ~/.config/zellij/config.kdl:
#
# ┌─────────────────────────────────────────────────────────────────┐
# │ themes {                                                        │
# │     cyberpunk {                                                 │
# │         bg "#0d1b2a"                                            │
# │         fg "#e8e8e8"                                            │
# │         black "#2e2e2e"                                         │
# │         red "#ff10f0"                                           │
# │         green "#00d9ff"                                         │
# │         yellow "#d084d1"                                        │
# │         blue "#6b46c1"                                          │
# │         magenta "#ff10f0"                                       │
# │         cyan "#00d9ff"                                          │
# │         white "#e8e8e8"                                         │
# │     }                                                           │
# │ }                                                               │
# │                                                                 │
# │ theme "cyberpunk"                                               │
# └─────────────────────────────────────────────────────────────────┘
#
# What this does:
#   ✓ Adds a new "cyberpunk" theme to your Zellij config
#   ✓ Makes Zellij colors match Kitty & Zen Browser
#   ✓ Creates visual coherence across all tools
#   ✓ Does NOT change any keybindings or layouts
#
# If you already have a custom theme, you can skip this or merge it!
#

# ============================================================================
# KITTY KEYBOARD PROTOCOL - OPTIONAL
# ============================================================================
#
# If you want advanced keyboard support in Tmux/Zellij with Kitty,
# add to ~/.tmux.conf:
#
#   set -s allow-passthrough on
#
# Or to ~/.config/zellij/config.kdl:
#
#   allow_passthrough true
#
# What this does:
#   ✓ Enables Kitty's extended keyboard protocol
#   ✓ Better handling of special keys (F-keys, Alt+, etc)
#   ✓ Improves key responsiveness
#   ✓ Does NOT affect basic functionality
#
# This is optional but recommended for smooth Kitty + multiplexer experience!
#

# ============================================================================
# COMMON CONFIGURATIONS - REFERENCE ONLY
# ============================================================================
#
# Below are examples of configurations that work well with this setup.
# These are provided as reference - modify as needed for YOUR workflow!
#

# --- Minimal Tmux Configuration (Reference) ---
# Add to ~/.tmux.conf for basic Kitty compatibility:
#
# # Color support
# set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",tmux-256color:RGB"
# set -ga terminal-overrides ",xterm-kitty:RGB"
#
# # Basic keybindings (customize as needed)
# set -g prefix C-a
# bind C-a send-prefix
# unbind C-b
#
# # Window and pane creation
# bind % split-window -h -c "#{pane_current_path}"
# bind '"' split-window -v -c "#{pane_current_path}"
# bind c new-window -c "#{pane_current_path}"
#
# # Mouse support
# set -g mouse on
#

# --- Minimal Zellij Configuration (Reference) ---
# Add to ~/.config/zellij/config.kdl for basic Kitty compatibility:
#
# # Enable true color
# allow_passthrough true
#
# # Add cyberpunk theme (optional)
# themes {
#     cyberpunk {
#         bg "#0d1b2a"
#         fg "#e8e8e8"
#         red "#ff10f0"
#         green "#00d9ff"
#         # ... etc
#     }
# }
#
# theme "cyberpunk"
#

