# Start here to decide what to apply:
#
# Q1: Do you already have Tmux/Zellij configured and working?
#     YES  → Skip to Q2
#     NO   → Use the minimal configurations above
#
# Q2: Do you want true color (24-bit) support in Tmux/Zellij?
