# Kitty Terminal Configuration - Optimized & Cyberpunk
# Professional setup for development, security research, and sysadmin work

# ============================================================================
# FONTS & TYPOGRAPHY
# ============================================================================
font_family      MesloLGS Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# Font features
disable_ligatures never
box_drawing_scale 0.001, 1, 1.5, 2

# ============================================================================
# COLORS - Cyberpunk Synthwave Theme
# ============================================================================
include cyberpunk-synthwave.conf

# ============================================================================
# APPEARANCE
# ============================================================================
background_opacity 0.9
background_blur 0
dim_opacity 0.75

# Window decorations
window_border_width 1
window_margin_width 0
window_padding_width 8 12
draw_minimal_borders yes
hide_window_decorations no

# Cursor
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0

# ============================================================================
# TABS & INTERFACE
# ============================================================================
tab_bar_style powerline
tab_bar_align left
tab_title_template "{title}"
tab_activity_symbol ●
active_tab_font_style bold
inactive_tab_font_style normal

# ============================================================================
# SCROLLBACK & HISTORY
# ============================================================================
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ============================================================================
# PERFORMANCE OPTIMIZATION
# ============================================================================
# Rendering
repaint_delay 10
input_delay 3
sync_to_monitor yes

# CPU usage
enable_audio_bell no
visual_bell_duration 0.0

# Memory optimization
detect_urls yes
url_style curly

# ============================================================================
# MOUSE & INTERACTION
# ============================================================================
copy_on_select yes
mouse_hide_wait 3.0
focus_follows_mouse yes
pointer_shape_when_grabbed arrow

# Click to open URLs
open_url_with firefox
detect_urls yes

# ============================================================================
# KEYBINDINGS - Professional Development & Red Team
# ============================================================================

# --- Window Navigation ---
map ctrl+left  neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up    neighboring_window up
map ctrl+down  neighboring_window down

# --- Tab Management ---
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab
map ctrl+shift+r set_tab_title

# --- Layout Management ---
map ctrl+shift+z toggle_layout stack
map ctrl+shift+l toggle_layout horizontal
map ctrl+shift+o toggle_layout vertical

# --- Window Splitting (Grid Layout) ---
map ctrl+alt+h launch --location=hsplit --cwd=current
map ctrl+alt+v launch --location=vsplit --cwd=current
map ctrl+alt+l launch --location=background

# --- Buffer Management (Paste/Copy) ---
map f1  copy_to_buffer a
map f2  paste_from_buffer a
map f3  copy_to_buffer b
map f4  paste_from_buffer b
map f5  copy_to_buffer c
map f6  paste_from_buffer c

# --- Scroll & Search ---
map ctrl+shift+up scroll_page_up
map ctrl+shift+down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end
map ctrl+shift+g show_scrollback

# --- Font Size Control ---
map ctrl+plus increase_font_size
map ctrl+minus decrease_font_size
map ctrl+0 reset_font_size

# --- Display & Debug ---
map ctrl+shift+f11 toggle_fullscreen
map ctrl+shift+d debug_config
map ctrl+shift+escape kitty_shell window

# --- SSH & Remote ---
map ctrl+alt+s launch --type=overlay --stdin-source=@screen_current fish -c "ssh \$(fzf)"

# --- Development Helpers ---
map ctrl+alt+g launch --type=overlay --stdin-source=@screen_current fish -c "git log --oneline -n 20"
map ctrl+alt+d launch --type=overlay --stdin-source=@screen_current docker ps -a

# --- Marks for work sessions ---
map ctrl+shift+1 create_marker
map ctrl+shift+2 remove_marker
map ctrl+shift+3 toggle_marker

# ============================================================================
# SHELL & ENVIRONMENT
# ============================================================================
shell fish
editor nvim
allow_remote_control socket-only

# ============================================================================
# TMUX & ZELLIJ INTEGRATION
# ============================================================================
# Allow Kitty to work seamlessly with tmux and zellij
# Support for true color (24-bit)
wayland_titlebar_color system
macos_titlebar_color system

# ============================================================================
# ADVANCED SETTINGS
# ============================================================================
# Clipboard integration
clipboard_control write-clipboard read-clipboard read-primary

# OS specific bells
linux_bell_theme __SYSTEM__

# Fallback fonts for symbols
fallback_fonts Noto Color Emoji
