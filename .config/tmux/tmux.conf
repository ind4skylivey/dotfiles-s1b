set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins"
# -----------------------------------------------------------------------------
#  TMUX PROFESSIONAL CONFIGURATION (SOBER EDITION)
#  Focus: Stability, Performance, Ergonomics.
# -----------------------------------------------------------------------------

# --- CORE & PERFORMANCE ---
set-option -g default-shell /usr/bin/fish
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -s escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g detach-on-destroy off
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on

# --- KEYBINDINGS (ERGONOMICS) ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded"

# Window Management
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Navigation (Vim/Helix Integration)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|l?n?vim?x?|helix|hx)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Resize
bind -n M-H resize-pane -L 2
bind -n M-J resize-pane -D 2
bind -n M-K resize-pane -U 2
bind -n M-L resize-pane -R 2

# Copy Mode (vi-style keys for navigation in copy/scroll mode)
setw -g mode-keys vi

# --- POWER TOOLS ---

set -g sessionizer "~/.config/tmux/scripts/sessionizer.sh"
set -g projects-menu "~/.config/tmux/scripts/projects-menu.sh"
set -g sesh-picker "~/.config/tmux/scripts/sesh-picker.sh"

# 1. Session tree sorted by last used (Prefix + s)
bind s choose-tree -Zs -O time -F "#{session_windows}"

# 2. Toggle last session, like cd - (Prefix + b)
bind b switch-client -l

# 3. Project picker: fixed paths + browse shenanigans/Repos (Prefix + p)
bind p display-popup -E -w 85% -h 85% "#{projects-menu}"

# 4. sesh launcher with preview (Prefix + T) — needs: sesh in PATH
bind T run-shell "#{sesh-picker}"

# 6. Fuzzy session switch by name (Prefix + f) — fallback if preferís fzf
bind f display-popup -E "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs -r tmux switch-client -t"

# 7. Floating Terminal (Prefix + t)
bind t display-popup -E -w 80% -h 80% "fish"

# 8. AI Chat Popup (Ctrl+g)
bind -n C-g run-shell "tmux display-popup -w '80%' -h '80%' -E '~/scripts/chat-popup.sh'"

# --- AESTHETICS (SOBER & PROFESSIONAL) ---
# Goal: High contrast, minimal noise. No distractions.

# Status Bar Design
set -g status-position bottom
set -g status-style "bg=default fg=#a9b1d6"
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

# Left: Session Name + Mode Indicator
set -g status-left "#{?client_prefix,#[fg=#f7768e]#[bold] PREFIX ,#[fg=#7aa2f7]#[bold] #S }#[fg=#565f89]│ "

# Right: Hostname + Date
set -g status-right "#[fg=#7aa2f7,bold]CPU:#{cpu_percentage} #[fg=#565f89]│ %H:%M "

# Windows: Minimalist tabs
setw -g window-status-format "#[fg=#565f89]#I:#W"
setw -g window-status-current-format "#[fg=#e0af68]#[bold]#I:#W"
setw -g window-status-separator "  "

# Borders
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"

# --- PLUGINS ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'

# Quick jump (after tpm: y/Y quedan para tmux-yank en copy mode)
bind M run-shell "#{sessionizer} /media/il1v3y/HD2/HDfiles/shenanigans/Repos/Bitflow/Proyects/yamaha-backoffice"
bind L run-shell "#{sessionizer} /media/il1v3y/HD2/HDfiles/shenanigans/Repos/Bitflow/Proyects/yamaha-backoffice-l12"
bind C run-shell "#{sessionizer} /home/il1v3y/.config"
