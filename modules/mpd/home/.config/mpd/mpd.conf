music_directory    "/media/$USER/HD2/Gameru/Torrents/Music/HiFi"
playlist_directory "~/.config/mpd/playlists"
db_file            "~/.config/mpd/database.log"
log_file           "~/.config/mpd/mpd.log"
pid_file           "~/.config/mpd/pid"
state_file         "~/.config/mpd/state"

# Bind to both TCP and local socket (socket required for YouTube playback)
bind_to_address    "127.0.0.1"
port               "6600"
bind_to_address    "/tmp/mpd_socket"

audio_output {
    type        "alsa"
    name        "My ALSA Output"
    mixer_type  "software"
}

# Cava visualizer FIFO output
audio_output {
    type        "fifo"
    name        "cava_fifo"
    path        "/tmp/mpd.fifo"
    format      "44100:16:2"
}
