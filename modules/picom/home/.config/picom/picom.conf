# ============================================
# Picom Configuration - FULL MODE
# ============================================
# Full mode: all visual effects enabled.
#
# To switch back to minimal (focus mode):
#     ~/.config/picom/switch-mode.sh minimal
# ============================================

# --- Backend ---
# Note: glx-no-stencil and glx-no-rebind-pixmap are deprecated in v13,
# the driver now decides automatically.
backend = "glx";
glx-swap-method = 2;
vsync = true;
xrender-sync-fence = true;

# --- Damage tracking (useful in multi-monitor setups) ---
# Note: resize-damage is deprecated in v13, use-damage covers it.
use-damage = true;
crop-shadow-to-monitor = true;     # Crop shadows to the monitor (multi-monitor)

# --- Performance ---
unredir-if-possible = true;
unredir-if-possible-delay = 5000;

# --- Focus tracking (needed in some WMs) ---
mark-wmwin-focused = true;
mark-ovredir-focused = true;

# --- D-Bus ---
dbus = true;

# --- Shadows ---
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.7;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-color = "#000000";
shadow-exclude = [
  "class_g = 'slstatus'",
  "class_g = 'Dunst'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'warp'",              # Warp doesn't need shadows
  "_GTK_FRAME_EXTENTS@"
];

# --- Fading (smooth transitions) ---
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 6;
no-fading-openclose = false;

# --- Transparency (subtle) ---
active-opacity = 1.0;
inactive-opacity = 0.92;
frame-opacity = 0.9;
inactive-opacity-override = false;

opacity-rule = [
  "100:class_g = 'warp'",
  "90:class_g  = 'kitty'",
  "100:class_g = 'es-de'",
  "100:class_g = 'OpenRGB'",
  "100:class_g = 'retroarch'",
  "100:class_g = 'mpv'",
  "100:class_g = 'slstatus'",
  "100:class_g = 'Dunst'",
  "100:fullscreen",
  "100:window_type = 'dock'",
  "100:window_type = 'desktop'",
  "100:_NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN'"
];

# --- Blur (dual_kawase) ---
blur-method = "dual_kawase";
blur-size = 6;                     # 6 = general balance, good enough
blur-strength = 5;
blur-background = true;
blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'slstatus'",
  "class_g = 'Dunst'",
  "class_g = 'warp'",              # Warp (Electron) doesn't play well with blur
  "class_g = 'mpv'",
  "class_g = 'retroarch'",
  "class_g = 'es-de'",
  "_GTK_FRAME_EXTENTS@"
];

# --- Rounded corners ---
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'slstatus'",
  "class_g = 'warp'"
];
detect-rounded-corners = true;

# --- Animations (requires a picom fork that supports them) ---
animations = true;
animation-stiffness = 200;
animation-dampening = 20;
animation-window-mass = 0.5;
animation-clamping = false;
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-menu-window = "slide-down";
animation-for-transient-window = "slide-down";

# --- Detection ---
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# --- Window types ---
wintypes:
{
  tooltip        = { fade = false; shadow = false; opacity = 1.0; focus = true; };
  dock           = { shadow = false; clip-shadow-above = true; };
  dnd            = { shadow = false; };
  popup_menu     = { opacity = 1.0; shadow = false; };
  dropdown_menu  = { opacity = 1.0; shadow = false; };
  utility        = { opacity = 1.0; };
  menu           = { opacity = 1.0; };
};

# --- Logging ---
log-level = "warn";
log-file = "/tmp/picom.log";
