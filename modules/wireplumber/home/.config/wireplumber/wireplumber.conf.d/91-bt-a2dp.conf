# Configuración BT para Razer Hammerhead True Wireless
# Se aplica cuando el dispositivo está conectado

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "bluez_card.18_95_52_06_0A_DC" }
    ]
    actions = {
      update-props = {
        node.enabled = true
      }
    }
  }
]

# Prioridad de perfil BT: calidad sobre latencia
settings = {
  "bluetooth.profile-preference" = "quality"
  "bluetooth.autoswitch-to-headset-profile" = false
}
