monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_08_00.1.pro-output-3" }
    ]
    actions = {
      update-props = {
        node.description = "Monitor Samsung"
        node.nick = "Monitor Samsung"
        device.nick = "Monitor Samsung"
        audio.position = [ FL FR ]
      }
    }
  },
  {
    matches = [
      { node.name = "alsa_output.pci-0000_08_00.1.pro-output-8" }
    ]
    actions = {
      update-props = {
        node.description = "Monitor ASUS"
        node.nick = "Monitor ASUS"
        device.nick = "Monitor ASUS"
        audio.position = [ FL FR ]
      }
    }
  },
  {
    matches = [
      { node.name = "alsa_output.pci-0000_08_00.1.pro-output-9" }
    ]
    actions = {
      update-props = {
        node.description = "Monitor LG"
        node.nick = "Monitor LG"
        device.nick = "Monitor LG"
        audio.position = [ FL FR ]
      }
    }
  },
  {
    matches = [
      { node.name = "alsa_output.pci-0000_0a_00.4.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "Subwoofer / Line Out"
        node.nick = "Subwoofer / Line Out"
        device.nick = "Subwoofer / Line Out"
      }
    }
  },
  {
    matches = [
      { node.name = "alsa_output.pci-0000_08_00.1.pro-output-7" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  },
  {
    matches = [
      { node.name = "alsa_output.pci-0000_08_00.1.pro-output-10" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  },
  {
    matches = [
      { node.name = "alsa_output.pci-0000_08_00.1.pro-output-11" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
