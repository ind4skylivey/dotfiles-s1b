# Configuración de nodos predeterminados para este setup
# 3 monitores HDMI + Subwoofer + Mic analógico

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_08_00.1.pro-output-3" }
    ]
    actions = {
      update-props = {
        node.description = "Monitor Samsung"
        node.nick = "Monitor Samsung"
      }
    }
  },
  {
    matches = [
      { node.name = "alsa_output.pci-0000_08_00.1.pro-output-8" }
    ]
    actions = {
      update-props = {
        node.description = "Monitor ASUS"
        node.nick = "Monitor ASUS"
      }
    }
  },
  {
    matches = [
      { node.name = "alsa_output.pci-0000_08_00.1.pro-output-9" }
    ]
    actions = {
      update-props = {
        node.description = "Monitor LG"
        node.nick = "Monitor LG"
      }
    }
  },
  {
    matches = [
      { node.name = "alsa_output.pci-0000_0a_00.4.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "Subwoofer / Line Out"
        node.nick = "Subwoofer / Line Out"
        node.enabled = true
      }
    }
  },
  {
    matches = [
      { node.name = "alsa_input.pci-0000_0a_00.4.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "Microfono Analogico"
        node.nick = "Microfono Analogico"
        node.enabled = true
      }
    }
  }
]

# Default nodes - usar subwoofer como sink y mic como source
default-nodes.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_0a_00.4.analog-stereo" }
    ]
    actions = {
      update-props = {
        default.node = true
      }
    }
  }
]
