[Appearance]
color_scheme_path=$HOME/.config/qt5ct/colors/noctalia.conf
custom_palette=true
icon_theme=Papirus-Dark
standard_dialogs=default
style=breeze-dark

[Fonts]
fixed=@String(-1,0,10,0,0,0,Monospace)
font=@String(-1,0,10,0,50,0,0,0,0,0,Noto Sans)

[Interface]
activate_item_on_single_click=1
buttonbox_layout=0
cursor_flash_time=1000
dialog_buttons_have_icons=1
double_click_interval=400
gui_effects=@Invalid()
keyboard_scheme=2
menus_have_icons=1
show_shortcuts_in_tooltips=1
stylesheets=@Invalid()
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3

[SettingsWindow]
geometry=@ByteArray()
