pulse.rules = [
  # Analog line-out (rear jack) - Subwoofer/Line Out
  {
    matches = [{ node.name = "alsa_output.pci-0000_0a_00.4.analog-stereo" }]
    actions = { update-props = {
      node.nick = "Subwoofer / Line Out"
      node.description = "Subwoofer / Line Out"
    } }
  }

  # Samsung TV (HDMI 0)
  {
    matches = [{ node.name = "alsa_output.pci-0000_08_00.1.pro-output-3" }]
    actions = { update-props = {
      node.nick = "Monitor Samsung"
      node.description = "Monitor Samsung"
    } }
  }

  # ASUS VP228 (HDMI 2)
  {
    matches = [{ node.name = "alsa_output.pci-0000_08_00.1.pro-output-8" }]
    actions = { update-props = {
      node.nick = "Monitor ASUS"
      node.description = "Monitor ASUS"
    } }
  }

  # LG Ultragear (DP/HDMI 3)
  {
    matches = [{ node.name = "alsa_output.pci-0000_08_00.1.pro-output-9" }]
    actions = { update-props = {
      node.nick = "Monitor LG"
      node.description = "Monitor LG"
    } }
  }
]
