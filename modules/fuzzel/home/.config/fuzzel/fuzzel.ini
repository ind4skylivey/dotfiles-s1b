# ═══════════════════════════════════════════════════════════════════════
# FUZZEL - CYBERPUNK RED TEAM EDITION v2
# Group: s1bgr0up.inc
# Style: Glassmorphism + Red/Purple Cyberpunk
# ═══════════════════════════════════════════════════════════════════════

# Noctalia theme (top-level include directive; not valid inside [key-bindings])
include=$HOME/.config/fuzzel/themes/noctalia

[main]
# Font - JetBrains Mono
font=JetBrainsMono Nerd Font:size=12
use-bold=yes
letter-spacing=1

# Prompt - hacker style (red)
prompt=󰮶 s1bgroup:~# 

# Message banner - the wired signature
message=// the wired 🌐
message-mode=expand 

# Icon theme - Papirus Dark
icon-theme=Papirus-Dark
icons-enabled=yes
image-size-ratio=0.6

# Terminal
terminal=kitty

# Window - COMPACT
width=55
lines=10
line-height=26
minimal-lines=no
horizontal-pad=16
vertical-pad=10
inner-pad=6

# Behavior
match-mode=fuzzy
sort-result=yes
show-actions=yes
exit-on-keyboard-focus-loss=yes
filter-desktop=no
list-executables-in-path=no
cache=~/.cache/fuzzel

# Performance
match-workers=4
render-workers=4
delayed-filter-limit=100
delayed-filter-ms=50

# ═══════════════════════════════════════════════════════════════════════
# COLORS - Cyberpunk Red Team v2 (vibrant, blur-friendly)
# ═══════════════════════════════════════════════════════════════════════
[colors]
# Background - semi-transparent for blur effect (more opaque to hide square corners)
background=0a0f0acc

# Text - brighter green
text=9ab89aff
input=9ab89aff
placeholder=5a7a5aff
prompt=ff2d78ff
message=9ab89aff

# Match - vibrant purple
match=d04dffff

# Selection - red with more presence
selection=ff006466
selection-text=ffffffff
selection-match=ff2d78ff

# Counter
counter=5a7a5aff

# Border - neon green
border=00ff41aa

# ═══════════════════════════════════════════════════════════════════════
# BORDER - Rounded
# ═══════════════════════════════════════════════════════════════════════
[border]
width=2
radius=8
selection-radius=6

# ═══════════════════════════════════════════════════════════════════════
# DMENU MODE - For piping commands
# ═══════════════════════════════════════════════════════════════════════
[dmenu]
mode=text
exit-immediately-if-empty=yes

# ═══════════════════════════════════════════════════════════════════════
# KEY BINDINGS - Vim-style + Emacs + Custom
# ═══════════════════════════════════════════════════════════════════════
[key-bindings]
# Cancel/Exit
cancel=Escape Control+g

# Execute selected
execute=Return KP_Enter

# Navigation - Vim style
prev=Up Control+p
next=Down Control+n
prev-page=Page_Up KP_Page_Up
next-page=Page_Down KP_Page_Down

# Cursor movement - Emacs style
cursor-home=Home Control+a
cursor-end=End Control+e
cursor-left=Left Control+b
cursor-right=Right Control+f

# Edit operations
delete-prev=BackSpace
delete-next=Delete KP_Delete Control+d
delete-prev-word=Control+BackSpace Mod1+BackSpace
delete-next-word=Mod1+d Control+Delete

# Tab completion
execute-or-next=Tab

# Paste from clipboard
clipboard-paste=Control+v
